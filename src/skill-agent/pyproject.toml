[project]
name = "skill-assistant"
version = "0.1.0"
description = "A versatile assistant that can help with Gmail, finding skills, and ADK development."

dependencies = [
    "google-adk[a2a]==1.25.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.42.0",
]

[tool.agent-starter-pack]
# The built-in agent to use as a foundation
base_template = "adk"

# Template metadata (optional - falls back to [project] section)
name = "Basic ADK A2A agent template"
description = "Scaffold for a simple A2A ADK agent"

# Override settings from the base template
[tool.agent-starter-pack.settings]
# This template will only support the 'agent_engine' deployment target
deployment_targets = ["none"]
frontend_type = "none"
# Optional: Customize the directory name for agent files (default: "app")
agent_directory = "app"
