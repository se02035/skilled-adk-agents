[project]
name = "skilled-adk-agents"
version = "0.0.0"
description = "ADK agents with MCP skills (development tooling only; app deps remain in requirements.txt)"
requires-python = ">=3.12"
readme = "README.md"

[project.optional-dependencies]
dev = [
  "pre-commit>=4.0",
  "pyright>=1.1.350",
  "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = [
  ".agents",
  ".venv",
  ".adk",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = [
  "E501", # line length (formatter handles long lines where needed)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [
  ".venv",
  ".adk",
  "__pycache__",
  ".agents",
]
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
